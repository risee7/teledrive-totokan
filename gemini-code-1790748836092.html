<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Cloud Storage - Desa Totokan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 m-0 p-0 h-screen w-screen overflow-hidden text-gray-800">

    <!-- ================= LAYAR LOGIN ================= -->
    <div id="loginScreen" class="fixed inset-0 flex flex-col items-center justify-center p-4 bg-gray-100 z-50">
        <div class="bg-white rounded-xl shadow-lg p-6 sm:p-8 max-w-md w-full">
            <div class="text-center mb-6">
                <!-- Logo Login -->
                <img src="Lambang_Kabupaten_Ponorogo.png" alt="Logo Kabupaten Ponorogo" class="w-24 h-auto mx-auto mb-4 drop-shadow-md">
                <h1 class="text-2xl font-bold text-gray-800">Login TeleDrive</h1>
                <p class="text-gray-500 text-sm mt-1">Masukkan kredensial Bot API Anda</p>
            </div>

            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Bot Token</label>
                    <input type="text" id="botTokenInput" required placeholder="Contoh: 123456789:ABCdefGhI..." 
                           class="w-full border border-gray-300 px-4 py-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Chat ID</label>
                    <input type="text" id="chatIdInput" required placeholder="Contoh: 987654321" 
                           class="w-full border border-gray-300 px-4 py-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                    <p class="text-xs text-gray-400 mt-1">ID akun Telegram atau Grup tempat file disimpan.</p>
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg transition duration-200 shadow">
                    Hubungkan ke Telegram
                </button>
            </form>
        </div>
        
        <!-- Copyright Login -->
        <div class="mt-8 text-xs font-medium text-gray-400">
            Copyright &copy; Pemerintah Desa Totokan
        </div>
    </div>

    <!-- ================= LAYAR APLIKASI (FILE EXPLORER) ================= -->
    <div id="appScreen" class="hidden w-full h-screen flex flex-col bg-white">
        
        <!-- Header & Action Bar -->
        <div class="bg-blue-600 text-white p-3 sm:p-4 flex justify-between items-center shadow-md z-10">
            <div class="flex items-center gap-2 sm:gap-4">
                <h1 class="text-lg sm:text-xl font-bold flex items-center gap-1 sm:gap-2">
                    <i class="fa-brands fa-telegram"></i> <span class="hidden sm:inline">TeleDrive</span>
                </h1>
                <button onclick="handleLogout()" class="text-[10px] sm:text-xs bg-red-500 hover:bg-red-600 px-2 py-1 rounded transition ml-2" title="Keluar">
                    <i class="fa-solid fa-power-off"></i> <span class="hidden sm:inline ml-1">Disconnect</span>
                </button>
            </div>
            <div class="flex gap-2">
                <button onclick="promptCreateFolder()" class="bg-blue-700 hover:bg-blue-800 px-3 py-2 sm:px-4 sm:py-2 rounded text-sm font-medium transition shadow flex items-center">
                    <i class="fa-solid fa-folder-plus"></i> <span class="hidden sm:inline ml-2">Folder Baru</span>
                </button>
                <label class="bg-green-500 hover:bg-green-600 px-3 py-2 sm:px-4 sm:py-2 rounded text-sm font-medium cursor-pointer transition shadow flex items-center">
                    <i class="fa-solid fa-upload"></i> <span class="hidden sm:inline ml-2">Upload</span>
                    <!-- Fungsi onchange diubah ke uploadAsli -->
                    <input type="file" id="fileInput" class="hidden" onchange="uploadAsli(event)">
                </label>
            </div>
        </div>

        <!-- Breadcrumb Navigation -->
        <div class="bg-gray-50 border-b p-2 sm:p-3 px-4 sm:px-6 flex justify-between items-center text-xs sm:text-sm text-gray-600">
            <div id="breadcrumb" class="flex items-center flex-wrap gap-1">
                <!-- Diisi oleh JavaScript -->
            </div>
            <div class="text-[10px] sm:text-xs text-gray-400 whitespace-nowrap ml-4" id="connectionStatus">
                <!-- Status Koneksi -->
            </div>
        </div>

        <!-- File Explorer Area -->
        <div class="flex-1 overflow-y-auto p-4 sm:p-6 bg-gray-50/50 pb-20">
            <div id="loading" class="hidden text-center text-gray-500 py-10">
                <i class="fa-solid fa-circle-notch fa-spin text-3xl mb-2 text-blue-500"></i>
                <p id="loadingText">Mengunggah ke Telegram...</p>
                <p class="text-xs mt-2 text-gray-400" id="uploadingStatus"></p>
            </div>
            
            <div id="explorerGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 xl:grid-cols-8 gap-3 sm:gap-4">
                <!-- Item Folder/File akan dirender di sini -->
            </div>
            
            <div id="emptyState" class="hidden text-center text-gray-400 py-20 flex flex-col items-center justify-center h-full min-h-[300px]">
                <i class="fa-regular fa-folder-open text-5xl sm:text-6xl mb-4"></i>
                <p class="text-sm sm:text-base">Folder ini kosong.</p>
            </div>
        </div>
        
        <!-- Copyright Footer App -->
        <div class="bg-white border-t p-2 text-center text-[10px] sm:text-xs font-medium text-gray-400 z-10">
            Copyright &copy; Pemerintah Desa Totokan
        </div>
    </div>

    <!-- ================= SCRIPT LOGIKA ================= -->
    <script>
        let telegramCreds = { botToken: '', chatId: '' };
        let currentFolderId = 'root';
        
        // Database default jika belum ada data tersimpan
        let database = [
            { id: 'root', name: 'Home', type: 'folder', parentId: null }
        ];

        // --- SISTEM PENYIMPANAN DATABASE LOKAL ---
        function saveDatabase() {
            localStorage.setItem('teledrive_db', JSON.stringify(database));
        }

        function loadDatabase() {
            const savedDb = localStorage.getItem('teledrive_db');
            if (savedDb) {
                database = JSON.parse(savedDb);
            }
        }

        // --- SISTEM LOGIN ---
        function checkAuth() {
            const savedToken = localStorage.getItem('tg_botToken');
            const savedChatId = localStorage.getItem('tg_chatId');
            
            if (savedToken && savedChatId) {
                telegramCreds.botToken = savedToken;
                telegramCreds.chatId = savedChatId;
                loadDatabase();
                showAppScreen();
            } else {
                showLoginScreen();
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            const token = document.getElementById('botTokenInput').value.trim();
            const chatId = document.getElementById('chatIdInput').value.trim();

            if (token && chatId) {
                localStorage.setItem('tg_botToken', token);
                localStorage.setItem('tg_chatId', chatId);
                telegramCreds.botToken = token;
                telegramCreds.chatId = chatId;
                loadDatabase();
                showAppScreen();
            }
        }

        function handleLogout() {
            if(confirm("Apakah Anda yakin ingin keluar? Pastikan data aman.")){
                localStorage.removeItem('tg_botToken');
                localStorage.removeItem('tg_chatId');
                telegramCreds = { botToken: '', chatId: '' };
                showLoginScreen();
            }
        }

        function showLoginScreen() {
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('appScreen').classList.add('hidden');
        }

        function showAppScreen() {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('appScreen').classList.remove('hidden');
            
            document.getElementById('connectionStatus').innerHTML = 
                `<i class="fa-solid fa-circle text-green-500 text-[10px] mr-1"></i> ID: ${telegramCreds.chatId}`;
            
            render();
        }

        // --- SISTEM FILE EXPLORER ---
        function render() {
            const grid = document.getElementById('explorerGrid');
            const emptyState = document.getElementById('emptyState');
            const breadcrumb = document.getElementById('breadcrumb');
            grid.innerHTML = '';

            let path = [];
            let curr = database.find(item => item.id === currentFolderId);
            while (curr) {
                path.unshift(curr);
                curr = database.find(item => item.id === curr.parentId);
            }
            breadcrumb.innerHTML = path.map((p, index) => 
                `<span class="cursor-pointer hover:text-blue-600 hover:underline ${index === path.length - 1 ? 'font-bold text-gray-800' : ''}" 
                       onclick="navigateTo('${p.id}')">${p.name}</span>`
            ).join('<span class="mx-1 sm:mx-2 text-gray-400">/</span>');

            const itemsInFolder = database.filter(item => item.parentId === currentFolderId);

            if (itemsInFolder.length === 0) {
                emptyState.classList.remove('hidden');
                grid.classList.add('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
                grid.classList.remove('hidden');
            }

            const folders = itemsInFolder.filter(i => i.type === 'folder');
            const files = itemsInFolder.filter(i => i.type === 'file');

            [...folders, ...files].forEach(item => {
                const el = document.createElement('div');
                el.className = "p-3 sm:p-4 border border-gray-200 rounded-xl hover:bg-blue-50 transition cursor-pointer flex flex-col items-center text-center group relative bg-white shadow-sm hover:shadow-md";
                
                const deleteBtnHTML = `
                    <button onclick="deleteItem(event, '${item.id}')" title="Hapus ${item.type}" class="absolute top-1 sm:top-2 right-1 sm:right-2 bg-red-100 text-red-500 hover:bg-red-500 hover:text-white rounded-md w-6 h-6 sm:w-7 sm:h-7 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-all duration-200 z-10">
                        <i class="fa-solid fa-trash text-[10px] sm:text-xs"></i>
                    </button>
                `;

                if (item.type === 'folder') {
                    el.onclick = () => navigateTo(item.id);
                    el.innerHTML = `
                        ${deleteBtnHTML}
                        <i class="fa-solid fa-folder text-4xl sm:text-5xl text-blue-400 mb-2 sm:mb-3 group-hover:text-blue-500 transition mt-2"></i>
                        <span class="text-xs sm:text-sm font-medium text-gray-700 truncate w-full">${item.name}</span>
                    `;
                } else {
                    el.onclick = () => getFileLink(item.telegram_file_id, item.name);
                    el.innerHTML = `
                        ${deleteBtnHTML}
                        <i class="fa-solid fa-file-lines text-4xl sm:text-5xl text-gray-400 mb-2 sm:mb-3 group-hover:text-gray-500 transition mt-2"></i>
                        <span class="text-xs sm:text-sm font-medium text-gray-700 truncate w-full" title="${item.name}">${item.name}</span>
                    `;
                }
                grid.appendChild(el);
            });
        }

        function deleteItem(event, id) {
            event.stopPropagation(); 
            const item = database.find(i => i.id === id);
            if (!item) return;

            const isFolder = item.type === 'folder';
            if (confirm(`Hapus ${isFolder ? 'folder beserta isinya' : 'file'} "${item.name}" dari sistem?\n(File asli di Telegram tetap ada)`)) {
                if (isFolder) deleteFolderDanIsinya(id);
                else database = database.filter(i => i.id !== id);
                saveDatabase();
                render();
            }
        }

        function deleteFolderDanIsinya(folderId) {
            const children = database.filter(i => i.parentId === folderId);
            children.forEach(child => {
                if (child.type === 'folder') deleteFolderDanIsinya(child.id);
            });
            database = database.filter(i => i.parentId !== folderId && i.id !== folderId);
        }

        function navigateTo(folderId) {
            currentFolderId = folderId;
            render();
        }

        function promptCreateFolder() {
            const folderName = prompt("Masukkan nama folder baru:");
            if (folderName && folderName.trim() !== "") {
                database.push({
                    id: 'folder_' + Date.now(),
                    name: folderName,
                    type: 'folder',
                    parentId: currentFolderId
                });
                saveDatabase();
                render();
            }
        }

        // --- SISTEM UPLOAD NYATA KE TELEGRAM API ---
        async function uploadAsli(event) {
            const file = event.target.files[0];
            if (!file) return;

            // Cek limit 50MB
            if (file.size > 50 * 1024 * 1024) {
                alert("Maaf, ukuran file melebihi batas 50 MB yang diizinkan oleh Telegram API reguler.");
                event.target.value = '';
                return;
            }

            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('explorerGrid').classList.add('hidden');
            document.getElementById('emptyState').classList.add('hidden');
            document.getElementById('uploadingStatus').innerText = `Mengunggah file: ${file.name}...\nTarget Chat ID: ${telegramCreds.chatId}`;

            // Siapkan form data untuk dikirim
            const formData = new FormData();
            formData.append('chat_id', telegramCreds.chatId);
            formData.append('document', file);
            // Tambahkan caption agar mudah dicari di obrolan Telegram
            formData.append('caption', `Diunggah via TeleDrive: ${file.name}`);

            const url = `https://api.telegram.org/bot${telegramCreds.botToken}/sendDocument`;

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.ok) {
                    // Berhasil, ambil file_id dari respon Telegram
                    const fileId = data.result.document.file_id;
                    
                    database.push({
                        id: 'file_' + Date.now(),
                        name: file.name,
                        type: 'file',
                        parentId: currentFolderId,
                        telegram_file_id: fileId
                    });
                    
                    saveDatabase(); // Simpan perubahan ke storage
                } else {
                    throw new Error(data.description || "Gagal mengunggah file");
                }
            } catch (error) {
                console.error("Upload error:", error);
                alert("Terjadi kesalahan saat mengunggah: " + error.message);
            } finally {
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('fileInput').value = ''; 
                render();
            }
        }

        // --- SISTEM DOWNLOAD (MENDAPATKAN LINK ASLI DARI TELEGRAM) ---
        async function getFileLink(fileId, fileName) {
            const url = `https://api.telegram.org/bot${telegramCreds.botToken}/getFile?file_id=${fileId}`;
            
            try {
                // Tampilkan indikator saat mengambil link
                const tempText = document.getElementById('connectionStatus').innerHTML;
                document.getElementById('connectionStatus').innerHTML = "Mengambil link unduhan...";
                
                const response = await fetch(url);
                const data = await response.json();
                
                document.getElementById('connectionStatus').innerHTML = tempText;

                if (data.ok) {
                    const filePath = data.result.file_path;
                    const downloadUrl = `https://api.telegram.org/file/bot${telegramCreds.botToken}/${filePath}`;
                    
                    // Buka link di tab baru untuk mengunduh
                    window.open(downloadUrl, '_blank');
                } else {
                    alert("Gagal mengambil file: " + data.description);
                }
            } catch (error) {
                alert("Kesalahan koneksi saat mengambil file.");
            }
        }

        // Inisialisasi awal
        checkAuth();
    </script>
</body>
</html>
